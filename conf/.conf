# Server side project directory 
server_dir=api

# Server addr
server_addr=127.0.0.1
protocol_prefix=http://

# Port that the server is going to use
server_port=6742

# Name for the podman image when building and refering it
podman_image_name=42cli-api-server

# ENVIRONMENT VARIRABLES
# Name for the env variable that is going to store the podman running container id
container_id_env_var_name=42CLI_SERVER_CONTAINER_ID 
secret_env_var_name=42_CLI_API_KEY